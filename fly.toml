app = "metodikish"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/services"

[mounts]
  source = "metodikish_data"
  destination = "/app/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
